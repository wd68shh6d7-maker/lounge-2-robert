<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6f8f58"/><stop offset=".48" stop-color="#d9a33d"/><stop offset="1" stop-color="#ef6b28"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8ed5cf"/><stop offset=".45" stop-color="#3f9fa6"/><stop offset="1" stop-color="#175b70"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#fff7c4" stop-opacity=".95"/><stop offset=".35" stop-color="#ffd66a" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#000" stop-opacity=".08"/><stop offset=".6" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".6"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
 <clipPath id="round"><rect width="1024" height="1024" rx="150"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="1024" height="1024" fill="url(#sky)"/>
<circle cx="820" cy="155" r="210" fill="url(#sun)"/>
<!-- distant forest -->
<path d="M0 300 Q120 220 240 320T470 300T700 285T1024 310V610H0Z" fill="#3f663d" opacity=".8"/>
<!-- trunks -->
<g fill="#5a3c25">
<path d="M85 0h80l-18 470-80 70z"/><path d="M240 0h62l18 440-55 70z"/>
<path d="M470 0h72l-8 460-66 0z"/><path d="M690 0h78l-28 470-63-10z"/>
<path d="M900 0h72l52 500-74-25z"/>
</g>
<g fill="#e7b43c">
<circle cx="85" cy="105" r="105"/><circle cx="205" cy="145" r="110"/><circle cx="360" cy="85" r="120"/><circle cx="585" cy="115" r="125"/><circle cx="770" cy="100" r="125"/><circle cx="940" cy="165" r="150"/>
</g>
<g fill="#d85b28" opacity=".9">
<circle cx="20" cy="260" r="85"/><circle cx="300" cy="235" r="100"/><circle cx="530" cy="235" r="90"/><circle cx="830" cy="250" r="110"/><circle cx="1010" cy="285" r="105"/>
</g>
<g fill="#a9462a" opacity=".82">
<circle cx="145" cy="205" r="58"/><circle cx="425" cy="170" r="70"/><circle cx="710" cy="190" r="65"/><circle cx="965" cy="95" r="62"/>
</g>
<!-- banks -->
<path d="M0 570 Q180 500 360 590T700 555T1024 540V1024H0Z" fill="#3d5439"/>
<path d="M0 655 Q190 575 390 665T700 625T1024 610V1024H0Z" fill="#253d35"/>
<!-- stream -->
<path d="M230 1024 Q170 900 330 810 Q460 735 420 650 Q390 585 500 555 Q630 520 700 610 Q760 685 665 755 Q565 830 700 890 Q820 945 890 1024Z" fill="url(#water)"/>
<path d="M270 1015 Q230 905 350 835 Q485 755 455 665 Q440 610 510 585 Q595 555 665 625" fill="none" stroke="#dff8f0" stroke-width="22" opacity=".7" filter="url(#soft)"/>
<path d="M390 900 Q500 845 650 900T850 1010" fill="none" stroke="#c8f5ed" stroke-width="15" opacity=".65"/>
<path d="M450 715 Q535 680 625 710" fill="none" stroke="#ffffff" stroke-width="12" opacity=".7"/>
<g fill="#354b45"><ellipse cx="360" cy="865" rx="80" ry="35"/><ellipse cx="610" cy="625" rx="55" ry="25"/><ellipse cx="700" cy="915" rx="70" ry="30"/></g>
<rect width="1024" height="1024" fill="url(#shade)"/>
<!-- title -->
<g fill="#fff" text-anchor="middle" font-family="Georgia,Times New Roman,serif" filter="url(#shadow)">
<text x="512" y="295" font-size="82" font-style="italic">The</text>
<text x="512" y="410" font-size="126" font-weight="700" font-style="italic">Living</text>
<text x="512" y="535" font-size="126" font-weight="700" font-style="italic">Water.</text>
</g>
<!-- cross and waves -->
<g fill="#fff" filter="url(#shadow)">
<rect x="488" y="575" width="48" height="130" rx="8"/><rect x="445" y="610" width="134" height="45" rx="8"/>
</g>
<g fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" filter="url(#shadow)">
<path d="M355 720 Q405 690 455 720 T555 720"/>
<path d="M470 760 Q520 730 570 760 T670 760"/>
<path d="M355 800 Q405 770 455 800"/>
<path d="M570 800 Q620 770 670 800"/>
</g>
<rect x="20" y="20" width="984" height="984" rx="135" fill="none" stroke="#fff" stroke-opacity=".78" stroke-width="14"/>
</g>
</svg>